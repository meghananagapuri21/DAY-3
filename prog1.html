<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Properties</title>
    <link rel="stylesheet" href="prog1.css">
</head>
<body>
    <h1><mark>CSS Display Properties</mark></h1>

    <h2>Display : block (default)</h2>
    <div class="box block">This is Block Propertie</div>
    <div class="box block">This is Block Propertie</div>

    <h2>Display : inline</h2>

    <div class="box inline">This is Inline</div>
    <div class="box inline">This is Inline</div>
    <div class="box inline">This is Inline</div>

     <h2>Display : inline-block</h2>

    <div class="box inline-block">This is Inline</div>
    <div class="box inline-block">This is Inline</div>
    <div class="box inline-block">This is Inline</div>

    <h2>Display : none(hidden)</h2>
    <div class="box none">This will hide</div>
</body>
</html>
